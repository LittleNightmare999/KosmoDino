services:
  db:
    image: postgres:16-alpine
    container_name: cosmodino_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: encyclopedia
      POSTGRES_PASSWORD: encyclopedia
      POSTGRES_DB: encyclopedia
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encyclopedia -d encyclopedia"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
